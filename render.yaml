services:
  - type: web
    name: smartcare-hms
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn smartcare_hms.wsgi:application --bind 0.0.0.0:${PORT:-8000} --workers ${GUNICORN_WORKERS:-2} --threads ${GUNICORN_THREADS:-4} --worker-class gthread --timeout 120 --max-requests 1000 --max-requests-jitter 100 --access-logfile - --error-logfile -
    healthCheckPath: /health/
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: smartcare_hms_db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: smartcare_hms_redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: smartcare_hms_redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: smartcare_hms_redis
          property: connectionString

  - type: worker
    name: smartcare-hms-celery
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A smartcare_hms worker --loglevel=info
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: smartcare_hms_db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: smartcare_hms_redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: smartcare_hms_redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: smartcare_hms_redis
          property: connectionString

  - type: cron
    name: smartcare-hms-beat
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A smartcare_hms beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    schedule: "@daily"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: smartcare_hms_db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: smartcare_hms_redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: smartcare_hms_redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: smartcare_hms_redis
          property: connectionString

  - type: redis
    name: smartcare_hms_redis
    plan: starter

databases:
  - name: smartcare_hms_db
    plan: starter
